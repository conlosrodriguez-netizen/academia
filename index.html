<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./logo-iso.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <title>CONLOSRODRIGUEZ | Plataforma de Cursos de IA y Tecnología</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; }
      body {
        font-family: 'Montserrat', sans-serif;
        background: #f3f4f6;
        color: #1f2937;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        line-height: 1.5;
      }
      img { max-width: 100%; height: auto; display: block; }
      a { color: inherit; text-decoration: none; }
      button { cursor: pointer; font-family: inherit; }
      input, select, textarea { font-family: inherit; }
      .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
      @media (min-width: 640px) { .container { padding: 0 32px; } }
      @media (min-width: 1024px) { .container { padding: 0 48px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
